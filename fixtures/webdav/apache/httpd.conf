# Minimal Apache configuration that serves WebDAV on the official httpd image.
# docker-compose-webdav-apache.yml mounts this file over conf/httpd.conf.

ServerRoot "/usr/local/apache2"
Listen 80
ServerName localhost

LoadModule mpm_event_module modules/mod_mpm_event.so
LoadModule unixd_module modules/mod_unixd.so
LoadModule authz_core_module modules/mod_authz_core.so
LoadModule mime_module modules/mod_mime.so
LoadModule log_config_module modules/mod_log_config.so
LoadModule dav_module modules/mod_dav.so
LoadModule dav_fs_module modules/mod_dav_fs.so

# mod_dav evaluates the preconditions and then rewrites the file. A single
# worker keeps those steps from interleaving with another request; with the
# default worker count, concurrent conditional writes are silently lost.
# The compose file supplies these values so the worker count stays tunable.
<IfModule mpm_event_module>
    StartServers          ${APACHE_START_SERVERS}
    ServerLimit           ${APACHE_SERVER_LIMIT}
    ThreadsPerChild       ${APACHE_THREADS_PER_CHILD}
    MaxRequestWorkers     ${APACHE_MAX_REQUEST_WORKERS}
    MinSpareThreads       ${APACHE_MIN_SPARE_THREADS}
    MaxSpareThreads       ${APACHE_MAX_SPARE_THREADS}
</IfModule>

User www-data
Group www-data

ErrorLog /proc/self/fd/2
LogLevel warn

DavLockDB /usr/local/apache2/var/DavLock
DocumentRoot "/var/www/webdav"

<Directory "/var/www/webdav">
    Dav On
    Options None
    AllowOverride None
    Require all granted
</Directory>
