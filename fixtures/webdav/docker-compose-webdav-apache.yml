services:
  webdav-apache:
    image: httpd:latest
    ports:
      - "8080:80"
    environment:
      # Restrict Apache to a single process to test preconditions
      APACHE_START_SERVERS: "1"
      APACHE_SERVER_LIMIT: "1"
      APACHE_THREADS_PER_CHILD: "1"
      APACHE_MAX_REQUEST_WORKERS: "1"
      APACHE_MIN_SPARE_THREADS: "1"
      APACHE_MAX_SPARE_THREADS: "2"
    volumes:
      - ./apache/httpd.conf:/usr/local/apache2/conf/httpd.conf:ro
    tmpfs:
      - /var/www/webdav:rw,mode=1777,size=256m
      - /usr/local/apache2/var:rw,mode=1777,size=16m
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/80'"]
      interval: 1s
      timeout: 2s
      retries: 30
